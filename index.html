<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Aloud</title>
<!-- PDF / Word readers: local copies first, CDN as a fallback -->
<script src="vendor/pdf.min.js"></script>
<script>window.pdfjsLib || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>')</script>
<script src="vendor/mammoth.browser.min.js"></script>
<script>window.mammoth || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"><\/script>')</script>
<style>
  :root { --bg:#f6f5f2; --panel:#fff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e2e0db; --accent:#2f6fde; --hl:#fff1b8; --warn:#b4540a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --panel:#1e1e21; --ink:#ececef; --muted:#9a9aa2; --line:#2e2e33; --accent:#6c9cff; --hl:#4a4020; --warn:#f0a050; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, system-ui, sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); cursor:pointer; background:var(--panel); }
  .drop.over { border-color:var(--accent); color:var(--accent); }
  .hint { margin-top:10px; font-size:14px; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
  .controls label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  select, input[type=range], input[type=password], textarea { width:100%; }
  select, input[type=password], textarea { padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-size:15px; }
  textarea { min-height:70px; resize:vertical; font-size:14px; }
  .full { grid-column:1 / -1; }
  .small { font-size:12px; color:var(--muted); }
  .small a { color:var(--accent); }
  .warn { color:var(--warn); font-size:14px; background:var(--panel); border:1px solid var(--warn); border-radius:8px; padding:8px 12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .seg button { flex:1; border:none; border-radius:0; padding:10px 6px; line-height:1.3; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button small { display:block; font-size:12px; opacity:.75; }
  .seg button.on { background:var(--accent); color:#fff; }
  [hidden] { display:none !important; }
  .buttons { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  button { font:inherit; padding:9px 18px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.big { font-size:17px; padding:12px 26px; }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--muted); font-size:14px; align-self:center; margin-left:auto; }
  #files { list-style:none; padding:0; margin:12px 0 0; display:flex; flex-direction:column; gap:6px; }
  #files li { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  #files li.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  #files li .fname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #files li .meta { color:var(--muted); font-size:13px; }
  #files li .x { border:none; background:none; padding:2px 6px; color:var(--muted); }
  #now { position:sticky; top:0; z-index:5; background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:12px 16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .nowlabel { font-size:13px; color:var(--accent); font-weight:600; margin-bottom:4px; }
  #nowVoice { color:var(--muted); font-weight:400; }
  #nowText { font-size:19px; line-height:1.5; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin-top:10px; overflow:hidden; }
  #barFill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #text { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; min-height:200px; white-space:pre-wrap; outline:none; }
  #text:empty::before { content:"…or type / paste text here."; color:var(--muted); }
  .s { border-radius:3px; cursor:pointer; }
  .s.now { background:var(--hl); }
  mark.w { background:var(--accent); color:#fff; border-radius:3px; padding:0 2px; }
  @media (max-width:560px) { .controls { grid-template-columns:1fr; } .seg { flex-direction:column; } .seg button + button { border-left:none; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <h1>Read Aloud</h1>

  <div class="drop" id="drop">
    <button class="primary big" id="browse" type="button">📂 Browse &amp; Upload Files</button>
    <div class="hint">…or drag and drop files here. PDF, Word (.docx), .txt, .md, .html, .csv and .json are supported.</div>
    <input type="file" id="file" hidden multiple accept=".txt,.md,.pdf,.docx,.html,.htm,.csv,.json,.rtf,text/*">
  </div>

  <ul id="files"></ul>

  <div class="controls">
    <div class="full seg" id="engineSeg">
      <button type="button" data-engine="kokoro">🎙 Kokoro<small>natural · free · on this Mac</small></button>
      <button type="button" data-engine="local">💻 Built-in<small>Mac voices · free</small></button>
      <button type="button" data-engine="openai">✨ OpenAI<small>accents (Alabama) · needs key</small></button>
    </div>

    <!-- Kokoro -->
    <div class="full warn kokoro" id="kokoroWarn" hidden>
      Kokoro isn't running. Open the <b>text2Speech</b> folder and double-click <b>Read Aloud.command</b>.
      It opens this app with Kokoro switched on.
    </div>
    <label class="full kokoro">Voice
      <select id="kVoice"></select>
      <span class="small">★ = the most natural-sounding voices. Everything runs privately on your Mac, with no internet and no key.</span>
    </label>

    <!-- OpenAI -->
    <label class="full openai">Style / accent
      <select id="style">
        <option value="alabama">Alabama: warm Southern drawl</option>
        <option value="storyteller">Warm storyteller</option>
        <option value="friendly">Friendly and conversational</option>
        <option value="news">Clear newsreader</option>
        <option value="audiobook">Calm audiobook narrator</option>
        <option value="custom">Custom (write your own below)</option>
      </select>
    </label>
    <label class="full openai">How the voice should sound (you can edit this)
      <textarea id="instructions"></textarea>
    </label>
    <label class="openai">Voice
      <select id="aiVoice">
        <option value="ash">Ash (male, warm)</option>
        <option value="ballad">Ballad (male, soft)</option>
        <option value="onyx">Onyx (male, deep)</option>
        <option value="echo">Echo (male)</option>
        <option value="verse">Verse (male, expressive)</option>
        <option value="cedar">Cedar (male, natural)</option>
        <option value="coral">Coral (female, bright)</option>
        <option value="sage">Sage (female, calm)</option>
        <option value="shimmer">Shimmer (female)</option>
        <option value="nova">Nova (female, lively)</option>
        <option value="marin">Marin (female, natural)</option>
        <option value="alloy">Alloy (neutral)</option>
        <option value="fable">Fable (neutral, British)</option>
      </select>
    </label>
    <label class="openai">OpenAI API key
      <input type="password" id="apiKey" placeholder="sk-…" autocomplete="off">
      <span class="small">Saved only in this browser. Text is sent to OpenAI (~1–2¢ per minute of audio). <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Get a key</a></span>
    </label>

    <!-- Built-in -->
    <label class="full local">Voice
      <select id="voice"></select>
      <span class="small">★ = more natural. Get more free voices under System Settings → Accessibility → Spoken Content → System Voice → Manage Voices ("Enhanced" / "Premium"), then reload.</span>
    </label>

    <label>Speed <span id="rateV">1.0×</span><input type="range" id="rate" min="0.5" max="2" step="0.05" value="1"></label>
    <label class="local">Pitch <span id="pitchV">1.0</span><input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1"></label>
  </div>

  <div class="buttons">
    <button class="primary" id="play">▶ Play</button>
    <button id="pause" disabled>⏸ Pause</button>
    <button id="stop" disabled>⏹ Stop</button>
    <span id="status"></span>
  </div>

  <div id="now" hidden>
    <div class="nowlabel">🔊 Now speaking <span id="nowVoice"></span></div>
    <div id="nowText"></div>
    <div class="bar"><div id="barFill"></div></div>
  </div>

  <div id="text" contenteditable="true"></div>
</main>

<script>
// ================= State (declared first) =================
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
const voiceSel = $('voice'), textEl = $('text'), statusEl = $('status');
const SERVER = location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8787';   // opened via the server, or as a file
const CLIENT = Math.random().toString(36).slice(2);   // lets the server skip requests this page no longer needs
const audio = new Audio(); audio.preservesPitch = true;
const cache = new Map();          // sentence index -> Promise<objectURL>
let voices = [], sentences = [], idx = 0, playing = false, paused = false, token = 0;
let fetchCtl = new AbortController();
let gapTimer = 0, rafId = 0, lastMark = '', unlocked = false, kokoroOK = false, waitingForClick = false;
const savedEngine = safeGet('engine');
let engine = savedEngine || 'kokoro';

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = location.protocol.startsWith('http')
  ? 'vendor/pdf.worker.min.js'
  : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ================= Engine switch =================
function setEngine(e) {
  stop();
  engine = e; safeSet('engine', e);
  document.querySelectorAll('#engineSeg button').forEach(b => b.classList.toggle('on', b.dataset.engine === e));
  for (const k of ['kokoro', 'local', 'openai'])
    document.querySelectorAll('.' + k).forEach(el => { if (el.id !== 'kokoroWarn') el.hidden = e !== k; });
  $('kokoroWarn').hidden = !(e === 'kokoro' && !kokoroOK);
  clearCache();
}
document.querySelectorAll('#engineSeg button').forEach(b => b.onclick = () => setEngine(b.dataset.engine));

// ================= Kokoro (local AI server) =================
const K_GROUPS = { a: 'American English', b: 'British English', e: 'Spanish', f: 'French', h: 'Hindi', i: 'Italian', j: 'Japanese', p: 'Portuguese', z: 'Chinese' };
const K_BEST = ['af_heart', 'af_bella', 'am_michael', 'am_fenrir', 'am_puck', 'bf_emma', 'bm_george', 'bm_fable'];
async function checkKokoro() {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2000);
    const r = await fetch(SERVER + '/api/status', { signal: ctl.signal });
    const j = await r.json();
    kokoroOK = !!j.kokoro;
    const sel = $('kVoice'), saved = safeGet('kVoice') || 'am_michael';
    sel.innerHTML = '';
    const groups = {};
    j.voices.forEach(id => {
      const g = K_GROUPS[id[0]] || 'Other';
      if (!groups[g]) { groups[g] = document.createElement('optgroup'); groups[g].label = g; sel.appendChild(groups[g]); }
      const name = id.split('_')[1].replace(/^./, c => c.toUpperCase());
      const sex = id[1] === 'f' ? 'female' : 'male';
      groups[g].appendChild(new Option(`${K_BEST.includes(id) ? '★ ' : ''}${name} (${sex})`, id, false, id === saved));
    });
  } catch { kokoroOK = false; }
  if (!kokoroOK && engine === 'kokoro' && !savedEngine) engine = 'local';   // first run without server
  setEngine(engine);
}
$('kVoice').onchange = () => { safeSet('kVoice', $('kVoice').value); settingsChanged(); };

async function kokoroRequest(text, signal, gen, index) {
  for (let attempt = 0; ; attempt++) {
    let r;
    try {
      r = await fetch(SERVER + '/api/kokoro', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal,
        body: JSON.stringify({ text, voice: $('kVoice').value, speed: 1, client: CLIENT, gen, index }),
      });
    } catch (err) {
      if (signal.aborted) throw err;
      if (attempt < 1) { await sleep(800); continue; }          // one retry for a hiccup
      kokoroOK = false; $('kokoroWarn').hidden = false;
      throw new Error('Kokoro stopped responding. Double-click "Read Aloud.command" to start it again.');
    }
    if (r.ok) return URL.createObjectURL(await r.blob());
    if (r.status === 409) throw new DOMException('stale', 'AbortError');
    let msg = 'Kokoro error ' + r.status;
    try { msg = (await r.json()).error || msg; } catch {}
    if (r.status >= 500 && attempt < 1) { await sleep(500); continue; }
    throw new Error(msg);
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ================= OpenAI =================
const STYLES = {
  alabama: `Accent: a genuine, warm Alabama / Deep South accent with a relaxed Southern drawl. Stretch the vowels the way folks from Alabama do ("I" leans toward "Ah", "time" toward "tahm"), with a gentle, friendly lilt.
Tone: warm, homey and kind, like a good-natured neighbor reading aloud on the front porch.
Delivery: unhurried and conversational, never monotone. Rise and fall naturally, put a little emphasis on the important words, pause briefly at commas and a little longer at periods and between paragraphs.`,
  storyteller: `Tone: warm, engaging storyteller. Delivery: expressive and varied, building gently on interesting moments, with natural pauses at commas, periods and paragraph breaks. Never monotone.`,
  friendly: `Tone: friendly, relaxed and conversational, as if explaining this to a friend over coffee. Natural rhythm and intonation, light emphasis on key words, natural pauses at punctuation.`,
  news: `Tone: clear, confident, professional news anchor. Crisp articulation, measured pace, purposeful emphasis, clean pauses at punctuation.`,
  audiobook: `Tone: calm, soothing audiobook narrator. Smooth, steady pace with gentle expression, natural breathing pauses at commas and periods and longer pauses between paragraphs.`,
};
const styleSel = $('style'), instrEl = $('instructions');
styleSel.value = safeGet('style') || 'alabama';
instrEl.value = safeGet('instructions') || STYLES[styleSel.value] || STYLES.alabama;
styleSel.onchange = () => {
  if (styleSel.value !== 'custom') instrEl.value = STYLES[styleSel.value];
  safeSet('style', styleSel.value); safeSet('instructions', instrEl.value); settingsChanged();
};
instrEl.onchange = () => {
  styleSel.value = Object.keys(STYLES).find(k => STYLES[k] === instrEl.value) || 'custom';
  safeSet('style', styleSel.value); safeSet('instructions', instrEl.value); settingsChanged();
};
$('aiVoice').value = safeGet('aiVoice') || 'ash';
$('aiVoice').onchange = () => { safeSet('aiVoice', $('aiVoice').value); settingsChanged(); };
$('apiKey').value = safeGet('apiKey') || '';
$('apiKey').onchange = () => { safeSet('apiKey', $('apiKey').value.trim()); clearCache(); };

async function openaiRequest(text, signal) {
  let r;
  try {
    r = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST', signal,
    headers: { 'Authorization': 'Bearer ' + $('apiKey').value.trim(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'gpt-4o-mini-tts', voice: $('aiVoice').value, input: text, instructions: instrEl.value, response_format: 'mp3' }),
    });
  } catch (err) {
    if (signal.aborted) throw err;
    throw new Error('Could not reach OpenAI. Check your internet connection.');
  }
  if (!r.ok) {
    let msg = r.status + ' ' + r.statusText;
    try { msg = (await r.json()).error?.message || msg; } catch {}
    if (r.status === 401) msg = 'API key was rejected, please check it.';
    if (r.status === 429) msg = 'OpenAI rate limit or no credit left on the account: ' + msg;
    throw new Error(msg);
  }
  return URL.createObjectURL(await r.blob());
}

// ================= Built-in voices =================
const isGood = v => /enhanced|premium|neural|natural|siri/i.test(v.name);
function loadVoices() {
  voices = synth.getVoices().filter(v => v.localService).sort((a, b) =>
    a.lang.localeCompare(b.lang) || (isGood(b) - isGood(a)) || a.name.localeCompare(b.name));
  if (!voices.length) return;
  const saved = safeGet('voice');
  voiceSel.innerHTML = '';
  const groups = {};
  voices.forEach((v, i) => {
    const lang = v.lang || 'other';
    if (!groups[lang]) { groups[lang] = document.createElement('optgroup'); groups[lang].label = lang; voiceSel.appendChild(groups[lang]); }
    const o = new Option((isGood(v) ? '★ ' : '') + v.name, i);
    if (saved ? v.name === saved : v.default) o.selected = true;
    groups[lang].appendChild(o);
  });
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
voiceSel.onchange = () => { safeSet('voice', voices[voiceSel.value]?.name); settingsChanged(); };

// ================= Sliders =================
for (const k of ['rate', 'pitch']) {
  const el = $(k), lab = $(k + 'V');
  const v = safeGet(k); if (v) el.value = v;
  const show = () => lab.textContent = (+el.value).toFixed(k === 'rate' ? 2 : 1).replace(/0$/, '') + (k === 'rate' ? '×' : '');
  show();
  el.oninput = () => { show(); if (k === 'rate') audio.playbackRate = +el.value; };
  el.onchange = () => { safeSet(k, el.value); if (engine === 'local' && playing) play(idx); };
}
function settingsChanged() { clearCache(); if (playing) play(idx); }

// ================= File loading =================
const drop = $('drop'), fileIn = $('file'), fileList = $('files');
const uploaded = [];
$('browse').onclick = e => { e.stopPropagation(); unlockAudio(); fileIn.click(); };
drop.onclick = e => { if (e.target === drop || e.target.classList.contains('hint')) { unlockAudio(); fileIn.click(); } };
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); unlockAudio(); addFiles(e.dataTransfer.files); });

function addFiles(list) {
  const added = [...list].map(file => {
    const li = document.createElement('li');
    li.innerHTML = `<span>📄</span><span class="fname"></span><span class="meta">${(file.size / 1024).toFixed(0)} KB</span><button class="x" title="Remove">✕</button>`;
    li.querySelector('.fname').textContent = file.name;
    const entry = { file, text: null, li };
    li.onclick = e => {
      if (e.target.classList.contains('x')) {
        if (li.classList.contains('active')) { stop(); textEl.innerHTML = ''; sentences = []; }
        uploaded.splice(uploaded.indexOf(entry), 1); li.remove(); return;
      }
      unlockAudio(); openEntry(entry);
    };
    fileList.appendChild(li);
    uploaded.push(entry);
    return entry;
  });
  if (added.length) openEntry(added[0]);
}

async function openEntry(entry) {
  stop();
  uploaded.forEach(u => u.li.classList.toggle('active', u === entry));
  status('Reading ' + entry.file.name + '…');
  try {
    if (entry.text == null) entry.text = await extractText(entry.file);
    render(entry.text);
    play(0);
  } catch (err) { status('⚠ ' + err.message); }
}

async function extractText(file) {
  const name = file.name.toLowerCase();
  let text;
  if (name.endsWith('.pdf')) text = await readPdf(file);
  else if (name.endsWith('.docx')) {
    if (!window.mammoth) throw new Error('The Word reader did not load. Start the app with "Read Aloud.command".');
    text = (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
  }
  else if (name.endsWith('.doc')) throw new Error('Old .doc files are not supported. Save it as .docx or PDF first.');
  else if (/\.html?$/.test(name)) text = new DOMParser().parseFromString(await file.text(), 'text/html').body.innerText;
  else if (name.endsWith('.md')) text = stripMarkdown(await file.text());
  else text = await file.text();
  if (/\u0000/.test(text.slice(0, 2000))) throw new Error(file.name + ' does not look like a text document.');
  text = text.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!text) throw new Error('No readable text found in ' + file.name + ' (scanned PDFs need OCR).');
  return text;
}

// PDF: rebuild real paragraphs so wrapped lines don't create fake sentence breaks
async function readPdf(file) {
  if (!window.pdfjsLib) throw new Error('The PDF reader did not load. Start the app with "Read Aloud.command".');
  let pdf;
  try { pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; }
  catch (err) {
    if (err?.name === 'PasswordException') throw new Error(file.name + ' is password-protected.');
    throw new Error(file.name + ' could not be opened as a PDF.');
  }
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    if (pdf.numPages > 3) status(`Reading ${file.name}: page ${p} of ${pdf.numPages}…`);
    const c = await (await pdf.getPage(p)).getTextContent();
    const lines = []; let line = '', lastY = null;
    for (const it of c.items) {
      const y = it.transform[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { lines.push({ t: line.trim(), gap: Math.abs(lastY - y) }); line = ''; }
      line += it.str; lastY = y;
    }
    if (line.trim()) lines.push({ t: line.trim(), gap: 0 });
    pages.push(joinLines(lines));
  }
  return pages.join('\n\n');
}
function joinLines(lines) {
  const gaps = lines.map(l => l.gap).filter(g => g > 0).sort((a, b) => a - b);
  const normal = gaps[Math.floor(gaps.length / 2)] || 12;
  const maxLen = Math.max(...lines.map(l => l.t.length), 1);
  let out = '';
  lines.forEach((l, i) => {
    if (!l.t) return;
    out += l.t;
    const next = lines[i + 1];
    if (!next) return;
    const ends = /[.!?:;…]["')\]]?$/.test(l.t);
    const short = l.t.length < maxLen * 0.6;
    const bigGap = l.gap > normal * 1.4;
    if (/-$/.test(l.t) && /^[a-z]/.test(next.t)) out = out.slice(0, -1);
    else if (bigGap || (ends && short) || (short && !ends && /^[A-Z0-9•\-–]/.test(next.t))) out += '\n';
    else out += ' ';
  });
  return out;
}
function stripMarkdown(s) {
  return s.replace(/```[\s\S]*?```/g, '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/^#{1,6}\s*/gm, '').replace(/[*_`~>]/g, '').replace(/^\s*[-+]\s+/gm, '');
}

// ================= Sentences =================
function splitSentences(text) {
  const seg = window.Intl?.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'sentence' }) : null;
  const parts = seg ? [...seg.segment(text)].map(s => s.segment) : text.match(/[^.!?\n]+[.!?]*\s*|\n+/g) || [text];
  // Long sentences are split at natural pauses (commas, semicolons…) so each piece
  // is quick to prepare and the voice never keeps you waiting.
  const MAX = 140, out = [];
  for (const p of parts) {
    let rest = p;
    while (rest.length > MAX) {
      const head = rest.slice(0, MAX);
      let cut = Math.max(head.lastIndexOf(', '), head.lastIndexOf('; '), head.lastIndexOf(': '), head.lastIndexOf(' – '), head.lastIndexOf(' — '));
      if (cut < 40) cut = head.lastIndexOf(' ');
      if (cut < 1) cut = MAX - 1;
      out.push(rest.slice(0, cut + 1)); rest = rest.slice(cut + 1);
    }
    out.push(rest);
  }
  return out;
}
// Add the punctuation that headings / bullets / lines are missing, so the voice pauses
function speakable(s) {
  let t = s.replace(/\s+/g, ' ').replace(/^[•▪◦·\-–*]\s*/, '').replace(/\s+[-–—]\s+/g, ', ').trim();
  if (t && !/[.!?:;…,]["')\]]?$/.test(t)) t += '.';
  return t;
}
const pauseAfter = i => {
  const s = sentences[i] || '', n = sentences[i + 1] || '';
  if (/\n\s*\n/.test(s) || /^\s*\n\s*\n/.test(n)) return 650;   // paragraph
  if (/\n/.test(s) || /^\s*\n/.test(n)) return 420;              // line break / heading
  if (/:\s*$/.test(s)) return 300;
  return engine === 'local' ? 60 : 140;
};

function render(text) {
  clearCache();
  textEl.innerHTML = '';
  sentences = splitSentences(text);
  sentences.forEach((s, i) => {
    const span = document.createElement('span');
    span.className = 's'; span.textContent = s; span.dataset.i = i;
    textEl.appendChild(span);
  });
}
textEl.onclick = e => { const s = e.target.closest('.s'); if (s && playing) play(+s.dataset.i); };
textEl.oninput = () => { if (!playing) { sentences = []; clearCache(); } };

// ================= Playback (shared) =================
function play(from = 0) {
  if (!sentences.length || !textEl.querySelector('.s')) {
    const t = textEl.innerText.trim();
    if (!t) { status('Upload a file or type some text first.'); return; }
    render(t);
  }
  if (engine === 'openai' && !$('apiKey').value.trim()) { status('⚠ Enter your OpenAI API key, or pick Kokoro / Built-in.'); $('apiKey').focus(); return; }
  if (engine === 'kokoro' && !kokoroOK) { $('kokoroWarn').hidden = false; status('⚠ Start Kokoro first (see the note above).'); return; }
  halt();
  idx = from; playing = true; paused = false;
  setButtons();
  const t = ++token;
  next(t);
}
const next = t => engine === 'local' ? nextLocal(t) : nextAudio(t);
const skipBlank = () => { while (idx < sentences.length && !speakable(sentences[idx])) idx++; };

function advance(t) {
  const wait = pauseAfter(idx);
  idx++;
  gapTimer = setTimeout(function go() {
    if (t !== token) return;
    if (paused) { gapTimer = setTimeout(go, 150); return; }   // hold while paused between sentences
    next(t);
  }, wait);
}

// ---------- Built-in voices ----------
function nextLocal(t) {
  if (t !== token) return;
  skipBlank();
  if (idx >= sentences.length) return finish();
  const raw = sentences[idx], text = speakable(raw);
  highlight(idx);
  const u = new SpeechSynthesisUtterance(text);
  const v = voices[voiceSel.value];
  if (v) { u.voice = v; u.lang = v.lang; }
  const jitter = () => 1 + (Math.random() - 0.5) * 0.06;     // small natural variation
  let rate = +$('rate').value * jitter(), pitch = +$('pitch').value * jitter();
  if (/\?\s*$/.test(text)) pitch *= 1.06;
  if (/!\s*$/.test(text)) { rate *= 1.04; pitch *= 1.04; }
  if (text.length < 40 && /\n/.test(raw)) rate *= 0.93;
  u.rate = rate; u.pitch = pitch;
  u.onboundary = e => {
    if (t !== token || e.name === 'sentence') return;
    const m = text.slice(e.charIndex).match(/^\S+/);
    markWord(idx, mapIndex(raw, text, e.charIndex), m ? m[0].replace(/[.,;:!?"')\]]+$/, '').length : 0);
  };
  u.onend = () => { if (t === token) advance(t); };
  u.onerror = e => { if (t === token && !/interrupted|canceled/.test(e.error)) { status('⚠ ' + e.error); advance(t); } };
  status(`Sentence ${idx + 1} / ${sentences.length}`);
  synth.speak(u);
}

// ---------- Kokoro & OpenAI (audio clips) ----------
function clearCache() { for (const p of cache.values()) p.then(URL.revokeObjectURL, () => {}); cache.clear(); }
function fetchAudio(i) {
  if (!cache.has(i)) {
    const text = speakable(sentences[i]);
    const sig = fetchCtl.signal;
    const p = engine === 'openai' ? openaiRequest(text, sig) : kokoroRequest(text, sig, token, i);
    p.then(() => { p.done = true; }, () => { if (cache.get(i) === p) cache.delete(i); });
    cache.set(i, p);
  }
  return cache.get(i);
}
function prefetch(from, n) {
  for (let j = from, got = 0; j < sentences.length && got < n; j++)
    if (speakable(sentences[j])) { fetchAudio(j); got++; }
}

async function nextAudio(t) {
  if (t !== token) return;
  skipBlank();
  if (idx >= sentences.length) return finish();
  const i = idx;
  highlight(i);
  for (const [k, p] of cache) if (k < i - 1) { p.then(URL.revokeObjectURL, () => {}); cache.delete(k); }   // free played audio
  prefetch(i, engine === 'kokoro' ? 3 : 4);   // prepare the next sentences while this one plays
  if (!cache.get(i)?.done) status('Preparing voice…');
  let url;
  try { url = await fetchAudio(i); }
  catch (err) {
    if (t !== token || err.name === 'AbortError') return;
    const m = err.message; stop(); status('⚠ ' + m); return;
  }
  if (t !== token) return;
  status(`Sentence ${i + 1} / ${sentences.length}`);
  audio.src = url;
  audio.playbackRate = +$('rate').value;
  audio.onended = () => { cancelAnimationFrame(rafId); if (t === token) advance(t); };
  if (paused) return;                      // paused while loading → resume() will start it
  try { await audio.play(); }
  catch {
    if (t !== token) return;
    paused = true; waitingForClick = true; $('pause').textContent = '▶ Resume';
    status('Click ▶ Resume to start the audio');
    return;
  }
  trackWords(i, t);
}
// Audio clips have no word timings, so estimate the word from the playback position
function trackWords(i, t) {
  cancelAnimationFrame(rafId);
  const raw = sentences[i], words = [...raw.matchAll(/\S+/g)];
  const total = raw.trim().length || 1, lead = raw.length - raw.trimStart().length;
  const tick = () => {
    if (t !== token || idx !== i) return;
    if (audio.duration && !audio.paused) {
      const pos = lead + Math.min(1, audio.currentTime / (audio.duration * 0.95)) * total;
      const w = words.findLast(m => m.index <= pos) || words[0];
      if (w) markWord(i, w.index, w[0].replace(/[.,;:!?"')\]]+$/, '').length);
    }
    rafId = requestAnimationFrame(tick);
  };
  tick();
}
// Safari only allows audio to start from a click, so play a silent clip on the first click
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  audio.play().catch(() => {});
}

// ================= Highlighting =================
function mapIndex(raw, spoken, k) {
  const word = (spoken.slice(0, k).match(/\S+/g) || []).length;
  const m = [...raw.matchAll(/\S+/g)];
  const bulletOffset = /^\s*[•▪◦·\-–*]\s/.test(raw) ? 1 : 0;
  return (m[word + bulletOffset] || m[m.length - 1] || { index: 0 }).index;
}
function voiceLabel() {
  if (engine === 'kokoro') return 'Kokoro · ' + ($('kVoice').selectedOptions[0]?.text.replace('★ ', '') || '');
  if (engine === 'openai') return `${$('aiVoice').selectedOptions[0].text.split(' (')[0]} · ${styleSel.selectedOptions[0].text.split(':')[0]}`;
  return voices[voiceSel.value]?.name || 'default voice';
}
function highlight(i) {
  textEl.querySelectorAll('.s.now').forEach(el => { el.classList.remove('now'); el.textContent = sentences[el.dataset.i]; });
  lastMark = '';
  const el = textEl.querySelector(`.s[data-i="${i}"]`);
  const now = $('now');
  if (!el) { now.hidden = true; return; }
  el.classList.add('now');
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  now.hidden = false;
  $('nowText').textContent = sentences[i].trim();
  $('nowVoice').textContent = '· ' + voiceLabel();
  $('barFill').style.width = ((i + 1) / sentences.length * 100) + '%';
}
function markWord(i, start, len) {
  const s = sentences[i], el = textEl.querySelector(`.s[data-i="${i}"]`);
  if (!el || !len || lastMark === i + ':' + start) return;
  lastMark = i + ':' + start;
  const wrap = (node, str, off) => {
    node.textContent = '';
    const m = document.createElement('mark'); m.className = 'w'; m.textContent = str.slice(start - off, start - off + len);
    node.append(str.slice(0, start - off), m, str.slice(start - off + len));
  };
  wrap(el, s, 0);
  const lead = s.length - s.trimStart().length;
  if (start >= lead) wrap($('nowText'), s.trim(), lead);
}

// ================= Controls =================
function halt() { fetchCtl.abort(); fetchCtl = new AbortController(); clearCache(); clearTimeout(gapTimer); synth?.cancel(); audio.pause(); audio.onended = null; cancelAnimationFrame(rafId); waitingForClick = false; }
function pause() {
  if (!playing) return;
  paused = !paused;
  $('pause').textContent = paused ? '▶ Resume' : '⏸ Pause';
  status(paused ? 'Paused' : `Sentence ${idx + 1} / ${sentences.length}`);
  if (engine === 'local') { paused ? synth.pause() : synth.resume(); return; }
  if (paused) audio.pause();
  else if (audio.src && !audio.ended && audio.onended) { waitingForClick = false; audio.play().then(() => trackWords(idx, token)).catch(() => {}); }
}
function stop() { token++; halt(); playing = false; paused = false; idx = 0; highlight(-1); setButtons(); status(''); }
function finish() { playing = false; highlight(-1); setButtons(); status('Done ✓'); }
function setButtons() { $('pause').disabled = $('stop').disabled = !playing; $('pause').textContent = '⏸ Pause'; }
function status(s) { statusEl.textContent = s; }

$('play').onclick = () => { unlockAudio(); play(0); };
$('pause').onclick = pause;
$('stop').onclick = stop;
document.addEventListener('keydown', e => {
  if (e.target === textEl || /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); unlockAudio(); playing ? pause() : play(0); }
  if (e.code === 'Escape') stop();
});

function safeGet(k) { try { return localStorage.getItem('ra_' + k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem('ra_' + k, v); } catch {} }

setEngine(engine);
checkKokoro();
</script>
</body>
</html>
