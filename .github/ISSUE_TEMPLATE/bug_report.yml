name: 🐞 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem! Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I uploaded a PDF and clicked Play, but…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with "Read it For Me.bat"
        2. Choose Kokoro, voice Michael
        3. Upload a PDF
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: dropdown
    id: voice
    attributes:
      label: Voice option
      options: [Kokoro, Built-in, OpenAI, Not related to voices]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Safari 18, Edge 130…
  - type: textarea
    id: logs
    attributes:
      label: Messages or errors
      description: Text from the Terminal / command window, or the status message in the app. Please don't paste API keys.
      render: text
  - type: textarea
    id: file
    attributes:
      label: Example file (optional)
      description: If a specific file causes the problem, attach it or a small sample (only if it contains nothing private).
